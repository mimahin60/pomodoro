[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro"
version = "1.0.0"
description = "A simple GUI Pomodoro timer for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
]

[project.scripts]
pomodoro = "pomodoro.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
